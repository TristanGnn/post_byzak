<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Post_byZak – Rubriques</title>
<style>
/* Layout : maquettes Post_byZak — barre titre en pilule, 5 sections centrées (icône + contenu), bannière pub fixe en bas */
:root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #666666;
  --grey: #c4c4c4;
  --line: #cfcfcf;
  --pub: #1f2a36;
  --font: "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141414; --fg: #f0f0f0; --muted: #a0a0a0; --grey: #3a3a3a; --line: #444444; --pub: #0e151c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141414; --fg: #f0f0f0; --muted: #a0a0a0; --grey: #3a3a3a; --line: #444444; --pub: #0e151c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; }
.wrap {
  max-width: 820px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header .wrap { padding-block: 20px 8px; }
.pill {
  background: var(--grey); border-radius: 999px; text-align: center;
  font-size: 1.6rem; padding: 8px 16px;
}
nav { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
nav a {
  color: var(--fg); text-decoration: none; font-size: 0.85rem;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;
}
nav a:hover, nav a:focus-visible { background: var(--grey); }
main .wrap { display: grid; gap: 72px; padding-block: 40px 160px; }
section { display: grid; justify-items: center; gap: 28px; scroll-margin-top: 16px; }
.ico { width: 72px; height: 72px; color: var(--fg); }
.ico svg { width: 100%; height: 100%; }
.frame {
  border: 2px solid var(--line); border-radius: 36px;
  padding: 20px 24px; display: grid; justify-items: center; gap: 16px;
  width: min(100%, 520px);
}
.ph { background: var(--grey); border-radius: 6px; width: 100%; max-width: 100%; }
.doc { width: 60%; aspect-ratio: 3/4; }
a.lien { color: var(--fg); }

/* Shop */
.shop { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; width: 100%; }
.produit { border: 2px solid var(--line); border-radius: 36px; padding: 24px; display: flex; gap: 12px; justify-content: center; }
.veste { width: 42%; aspect-ratio: 3/4; border-radius: 30% 30% 8px 8px; background: var(--fg); }

/* Équipe */
.equipe { display: flex; gap: 48px; flex-wrap: wrap; justify-content: center; }
.profil { background: var(--grey); border-radius: 36px; width: 220px; padding: 20px 28px 28px; display: grid; justify-items: center; gap: 12px; }
.profil svg { width: 140px; height: 140px; color: var(--fg); }
.lignes { width: 100%; display: grid; gap: 14px; }
.lignes span { height: 3px; background: var(--fg); border-radius: 2px; }

/* Photos */
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; width: 100%; }
.photo { background: var(--grey); border-radius: 24px; padding: 10px 16px 20px; display: grid; gap: 8px; text-align: center; font-size: 1.15rem; min-width: 0; }
.photo .ph { aspect-ratio: 2/3; background: var(--muted); opacity: 0.45; }
.voir { display: grid; justify-items: center; gap: 8px; font-size: 1.15rem; }
.fleche { background: var(--grey); border: 0; border-radius: 999px; width: 220px; height: 100px; display: grid; place-items: center; color: var(--fg); cursor: pointer; }
.fleche svg { width: 80px; height: 60px; }
.fleche:focus-visible, nav a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

/* Design */
.affiche { width: 70%; aspect-ratio: 9/16; }
.devis { display: flex; align-items: center; gap: 18px; font-size: 1.2rem; color: var(--fg); text-decoration: none; }
.devis svg { width: 56px; height: 70px; }

/* Pub */
.pub {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--pub); color: #ffffff;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.pub div { height: 96px; display: grid; place-items: center; font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.8; }

@media (max-width: 560px) {
  .shop { grid-template-columns: 1fr; }
  .photos { grid-template-columns: 1fr 1fr; }
  .pill { font-size: 1.2rem; }
}
</style>
</head>
